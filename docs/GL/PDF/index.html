<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Shrinker v1.2</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.10.1/dist/ffmpeg.min.js?v=999"></script>
    
    <style>
        body { font-family: sans-serif; padding: 50px; text-align: center; }
        
        /* Progress Bar Styles */
        #progress-container { display: none; margin-top: 20px; }
        progress { width: 300px; height: 20px; }

        /* --- PATCH NOTES MODAL STYLES --- */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); /* Dimmed background */
            display: flex;
            align-items: center;     /* Vertical Center */
            justify-content: center; /* Horizontal Center */
            z-index: 1000;
        }

        #modal-box {
            background: white;
            padding: 25px;
            width: 90%;
            max-width: 400px;
            border-radius: 8px;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #modal-box h3 { margin-top: 0; color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        #modal-box ul { padding-left: 20px; color: #555; }
        #modal-box li { margin-bottom: 8px; }
        
        .close-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            float: right;
            margin-top: 10px;
        }
        .close-btn:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div id="modal-overlay">
        <div id="modal-box">
            <h3>Patch Notes v1.2</h3>
            <ul>
                <li><strong>New:</strong> Added a visual progress bar.</li>
                <li><strong>New:</strong> Added percentage text indicator.</li>
                <li><strong>Fix:</strong> Improved single-threaded core loading.</li>
            </ul>
            <button class="close-btn" onclick="document.getElementById('modal-overlay').style.display='none'">Got it!</button>
        </div>
    </div>

    <h2>Video Shrinker</h2>
    <input type="file" id="u" accept="video/*"><br><br>
    <button id="b" disabled>Convert</button>
    
    <div id="progress-container">
        <progress id="p" value="0" max="100"></progress>
        <br>
        <span id="t">0%</span>
    </div>

    <div id="l" style="margin-top:20px;font-family:monospace;"></div>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;

    const ffmpeg = createFFmpeg({ 
        log: true,
        corePath: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js?v=999'
    });

    const u = document.getElementById('u');
    const b = document.getElementById('b');
    const l = document.getElementById('l');
    const pContainer = document.getElementById('progress-container');
    const pBar = document.getElementById('p');
    const pText = document.getElementById('t');

    ffmpeg.setProgress(({ ratio }) => {
        const percent = (ratio * 100).toFixed(0);
        pBar.value = percent;
        pText.innerText = `${percent}%`;
    });

    (async()=>{
        try {
            await ffmpeg.load();
            b.disabled = false;
        } catch(e) { l.innerText = "Error: " + e.message; }
    })();

    u.onchange = () => b.disabled = false;

    b.onclick = async () => {
        if(!u.files[0]) return;
        b.disabled = true; l.innerText = "Processing...";
        
        pContainer.style.display = 'block';
        pBar.value = 0;
        pText.innerText = "0%";
        
        try {
            ffmpeg.FS('writeFile', 'in', await fetchFile(u.files[0]));
            await ffmpeg.run('-i','in','-vf','scale=-2:540','-c:v','libx264','-preset','ultrafast','out.mp4');
            const data = ffmpeg.FS('readFile','out.mp4');
            const url = URL.createObjectURL(new Blob([data.buffer], {type:'video/mp4'}));
            
            pBar.value = 100; pText.innerText = "100%";
            l.innerHTML = `<a href="${url}" download="video.mp4">Download Video</a>`;
        } catch(e) {
            l.innerText = e.message;
        }
    };
</script>
</body>
</html>
