<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Shrinker v2.0 (Threaded)</title>
    
    <style>
        body { font-family: sans-serif; padding: 50px; text-align: center; }
        select, button { padding: 10px; font-size: 16px; margin: 5px; }
        
        #progress-container { display: none; margin-top: 20px; }
        progress { width: 300px; height: 20px; }

        .stats { margin-top: 15px; color: #555; font-size: 16px; }
        .stat-box { display: inline-block; margin: 0 15px; }
        
        .result-success { color: #28a745; font-weight: bold; }

        /* --- MODAL --- */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        #modal-box {
            background: white; padding: 25px; width: 90%; max-width: 400px;
            border-radius: 8px; text-align: left; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .close-btn {
            background: #007bff; color: white; border: none; padding: 10px 20px;
            border-radius: 4px; cursor: pointer; float: right; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="modal-overlay">
        <div id="modal-box">
            <h3>Patch Notes v2.0</h3>
            <ul>
                <li><strong>Major Update:</strong> Added "Web Worker" support.</li>
                <li><strong>Fix:</strong> Solved "Browser slowing down" warnings.</li>
                <li><strong>Fix:</strong> UI no longer freezes during conversion.</li>
            </ul>
            <button class="close-btn" onclick="document.getElementById('modal-overlay').style.display='none'">Got it!</button>
        </div>
    </div>

    <h2>Video Shrinker</h2>
    
    <div>
        <input type="file" id="u" accept="video/*">
        <select id="res">
            <option value="240">240p</option>
            <option value="360">360p</option>
            <option value="480">480p</option>
            <option value="540" selected>540p (Default)</option>
            <option value="720">720p</option>
        </select>
    </div>
    <br>
    
    <div class="stats">
        <div class="stat-box">Original: <strong id="size-in">-</strong></div>
        <div class="stat-box">Result: <span id="size-out">-</span></div>
    </div>

    <br>
    <button id="b" disabled>Convert</button>
    
    <div id="progress-container">
        <progress id="p" value="0" max="100"></progress>
        <br>
        <span id="t">0%</span>
    </div>

    <div id="l" style="margin-top:20px;font-family:monospace;"></div>

    <script id="worker-code" type="javascript/worker">
        // Import FFmpeg inside the worker
        importScripts('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js');

        const { createFFmpeg } = FFmpeg;
        
        // Setup FFmpeg
        const ffmpeg = createFFmpeg({
            log: true,
            mainName: 'main', 
            corePath: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js'
        });

        self.onmessage = async function(e) {
            const { fileData, resolution, fileName } = e.data;

            try {
                if (!ffmpeg.isLoaded()) await ffmpeg.load();

                // Report progress back to main thread
                ffmpeg.setProgress(({ ratio }) => {
                    self.postMessage({ type: 'progress', ratio });
                });

                // Write file to memory
                ffmpeg.FS('writeFile', fileName, new Uint8Array(fileData));

                // Run FFmpeg
                await ffmpeg.run('-i', fileName, '-vf', `scale=-2:${resolution}`, '-c:v', 'libx264', '-preset', 'ultrafast', 'out.mp4');

                // Read result
                const data = ffmpeg.FS('readFile', 'out.mp4');
                
                // Send file back
                self.postMessage({ type: 'done', data: data.buffer }, [data.buffer]);

                // Cleanup
                ffmpeg.FS('unlink', fileName);
                ffmpeg.FS('unlink', 'out.mp4');

            } catch (err) {
                self.postMessage({ type: 'error', message: err.message });
            }
        };
    </script>

<script>
    // --- MAIN THREAD SCRIPT ---

    const u = document.getElementById('u');
    const res = document.getElementById('res');
    const b = document.getElementById('b');
    const l = document.getElementById('l');
    const pContainer = document.getElementById('progress-container');
    const pBar = document.getElementById('p');
    const pText = document.getElementById('t');
    const sizeIn = document.getElementById('size-in');
    const sizeOut = document.getElementById('size-out');
    
    let worker = null;

    // Helper: Create Worker from the script tag above
    function initWorker() {
        const blob = new Blob([document.getElementById('worker-code').textContent], { type: "text/javascript" });
        worker = new Worker(URL.createObjectURL(blob));

        worker.onmessage = function(e) {
            const msg = e.data;
            if (msg.type === 'progress') {
                if (msg.ratio > 0 && msg.ratio <= 1) {
                    const percent = (msg.ratio * 100).toFixed(0);
                    pBar.value = percent;
                    pText.innerText = `${percent}%`;
                }
            } else if (msg.type === 'done') {
                handleDone(msg.data);
            } else if (msg.type === 'error') {
                l.innerText = "Error: " + msg.message;
                b.disabled = false;
            }
        };
    }

    // Helper: Format Bytes
    const formatBytes = (bytes) => {
        if(bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    };

    u.onchange = () => {
        b.disabled = false;
        if(u.files[0]) {
            sizeIn.innerText = formatBytes(u.files[0].size);
            sizeOut.innerText = "-";
            sizeOut.className = "";
        }
    };

    function handleDone(arrayBuffer) {
        const originalSize = u.files[0].size;
        const newSize = arrayBuffer.byteLength;
        const savings = ((originalSize - newSize) / originalSize) * 100;
        const savingsText = savings > 0 ? `(-${savings.toFixed(0)}%)` : `(+${Math.abs(savings).toFixed(0)}%)`;

        sizeOut.innerText = `${formatBytes(newSize)} ${savingsText}`;
        sizeOut.className = "result-success";

        const url = URL.createObjectURL(new Blob([arrayBuffer], {type:'video/mp4'}));
        pBar.value = 100; pText.innerText = "100%";
        l.innerHTML = `<a href="${url}" download="video_${res.value}p.mp4">Download Video</a>`;
        b.disabled = false;
    }

    b.onclick = async () => {
        if(!u.files[0]) return;
        b.disabled = true; l.innerText = "Processing in background...";
        
        // Reset Progress
        pContainer.style.display = 'block';
        pBar.value = 0;
        pText.innerText = "0%";

        // Initialize (or re-initialize) worker
        if (worker) worker.terminate(); // Kill old worker to clear memory
        initWorker();

        // Read file as ArrayBuffer to send to Worker
        const reader = new FileReader();
        reader.onload = () => {
            // Send data to worker
            worker.postMessage({
                fileData: reader.result,
                resolution: res.value,
                fileName: u.files[0].name
            }, [reader.result]); // Transferable for speed
        };
        reader.readAsArrayBuffer(u.files[0]);
    };
</script>
</body>
</html>
