
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Shrinker (Stable v0.9.8)</title>
    
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.9.8/dist/ffmpeg.min.js"></script>
    
    <style>
        /* Modern Styling for your Tool */
        :root { --primary: #2563eb; --bg: #f8fafc; --surface: #ffffff; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        .card { background: var(--surface); padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 440px; text-align: center; }
        h2 { margin-top: 0; color: #1e293b; }
        
        .upload-area { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 30px; background: #f1f5f9; cursor: pointer; position: relative; transition: 0.2s; margin-bottom: 20px; }
        .upload-area:hover { border-color: var(--primary); background: #eff6ff; }
        .upload-area input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 16px; margin-bottom: 20px; }
        
        button { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #1d4ed8; }

        #log { margin-top: 15px; font-size: 12px; color: #64748b; font-family: monospace; }
        .download-btn { display: block; margin-top: 20px; background: #10b981; color: white; padding: 15px; border-radius: 10px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Video Shrinker</h2>
    
    <div class="upload-area" id="drop-zone">
        <span style="font-size: 40px">📂</span><br>
        <span id="file-label" style="font-weight:600; color:#475569">Click to upload video</span>
        <input type="file" id="uploader" accept="video/*">
    </div>

    <select id="resolution">
        <option value="720">720p (HD Quality)</option>
        <option value="540" selected>540p (Mobile Balanced)</option>
        <option value="480">480p (Small File)</option>
    </select>

    <button id="convert-btn" disabled>Loading Engine...</button>
    
    <div id="log"></div>
    <div id="result"></div>
</div>

<script>
    // Access the global FFmpeg variable
    const { createFFmpeg, fetchFile } = FFmpeg;

    // === THE FIX ===
    // We strictly use v0.9.8. This version does NOT have the "proxy_main" error
    // and does NOT require complex headers. It just works.
    const ffmpeg = createFFmpeg({ 
        log: true,
        corePath: 'https://unpkg.com/@ffmpeg/core@0.9.8/dist/ffmpeg-core.js'
    });

    const uploader = document.getElementById('uploader');
    const convertBtn = document.getElementById('convert-btn');
    const logEl = document.getElementById('log');
    const resultEl = document.getElementById('result');
    const fileLabel = document.getElementById('file-label');
    const dropZone = document.getElementById('drop-zone');
    let selectedFile = null;

    (async () => {
        try {
            await ffmpeg.load();
            convertBtn.textContent = "Convert Video";
            convertBtn.disabled = true;
        } catch(e) {
            logEl.textContent = "Error: " + e.message;
        }
    })();

    uploader.addEventListener('change', (e) => {
        selectedFile = e.target.files[0];
        if (selectedFile) {
            fileLabel.textContent = selectedFile.name;
            dropZone.style.background = "#dbeafe";
            dropZone.style.borderColor = "#2563eb";
            convertBtn.disabled = false;
        }
    });

    convertBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        convertBtn.disabled = true;
        convertBtn.textContent = "Processing... (Do not close tab)";
        logEl.textContent = "Starting...";

        ffmpeg.setLogger(({ message }) => {
            if (message.includes('time=')) logEl.textContent = message;
        });

        try {
            const res = document.getElementById('resolution').value;
            ffmpeg.FS('writeFile', 'input', await fetchFile(selectedFile));

            await ffmpeg.run(
                '-i', 'input', 
                '-vf', `scale=-2:${res}`, 
                '-c:v', 'libx264', 
                '-preset', 'ultrafast', 
                '-crf', '28', 
                'output.mp4'
            );

            const data = ffmpeg.FS('readFile', 'output.mp4');
            const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));

            resultEl.innerHTML = `<a class="download-btn" href="${url}" download="shrunk_${res}p.mp4">⬇️ Download Result</a>`;
            convertBtn.textContent = "Done!";
            convertBtn.disabled = false;
            
            try { ffmpeg.FS('unlink', 'input'); ffmpeg.FS('unlink', 'output.mp4'); } catch(e){}

        } catch (error) {
            logEl.textContent = "Error: " + error.message;
            convertBtn.textContent = "Failed";
            convertBtn.disabled = false;
        }
    });
</script>

</body>
</html>
